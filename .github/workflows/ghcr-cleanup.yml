# Reusable GHCR cleanup. Callers own the schedule; this workflow only runs
# when called.
#
# Caller example:
#   jobs:
#     cleanup:
#       permissions:
#         packages: write
#       uses: kauno-arkivyskupija/.github/.github/workflows/ghcr-cleanup.yml@v1
#       with:
#         package-name: my-project
#         keep-n-most-recent: 10
#       secrets:
#         token: ${{ secrets.GITHUB_TOKEN }}
#
# The token needs packages:write and the Admin role on the package, or the
# classic read:packages + delete:packages scopes. Callers pass their own
# GITHUB_TOKEN (or a dedicated PAT) through `secrets.token`.
#
# The action is fail-closed for multi-arch images: children and attestations of
# kept tagged versions are protected from deletion.

name: GHCR cleanup

on:
    workflow_call:
        inputs:
            package-name:
                description: Container package to prune
                required: true
                type: string
            keep-n-most-recent:
                description: Number of newest tagged builds to keep
                required: false
                type: number
                default: 10
            cut-off:
                description: Only versions older than this are candidates (for example 1d or 2w)
                required: false
                type: string
                default: 1d
            dry-run:
                description: Print deletions instead of applying them
                required: false
                type: boolean
                default: false
        secrets:
            token:
                description: GITHUB_TOKEN with packages:write, or a classic PAT with read:packages and delete:packages
                required: true

permissions:
    packages: write

jobs:
    cleanup:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Prune ${{ inputs.package-name }}
              uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
              with:
                  account: ${{ github.repository_owner }}
                  token: ${{ secrets.token }}
                  image-names: ${{ inputs.package-name }}
                  cut-off: ${{ inputs.cut-off }}
                  keep-n-most-recent: ${{ inputs.keep-n-most-recent }}
                  timestamp-to-use: created_at
                  dry-run: ${{ inputs.dry-run }}
